name: Daily digest

on:
  schedule:
    # 06:23 UTC on weekdays (07:23 Amsterdam in winter, 08:23 in summer)
    - cron: '23 6 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Send only to this GitHub login (for testing)'
        required: false
      runner:
        description: 'Where to run (runner-watchdog sets "hosted" when the Oracle runner is down)'
        type: choice
        options: [self-hosted, hosted]
        default: self-hosted

permissions:
  contents: read
  issues: write
  # The digest also republishes the dashboard with the data it just collected, so the
  # "Open your dashboard" link shows the same items as the email even when GitHub has
  # skipped the scheduled collect runs.
  pages: write
  id-token: write

# Same group as collect.yml: both deploy Pages, and GitHub rejects a deploy while another is running.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ${{ inputs.runner == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ARM64","oracle"]') }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect fresh data
        run: node src/collect.mjs --out site/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Send digests
        run: node src/digest.mjs --data site/data.json ${ONLY:+--only "$ONLY"}
        env:
          ONLY: ${{ inputs.only }}
          # Posts the digest comments in this repo (built-in token, issues: write).
          POST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional, only for subscribers with `email: true`.
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
      # After sending, so a Pages hiccup never blocks the digest itself.
      - name: Publish the same data to the dashboard
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5
      - if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Pages sometimes still reports an earlier deploy as "in progress" after it finished.
      - name: Wait, then retry the deploy once
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: sleep 180
      - id: deploy-retry
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
