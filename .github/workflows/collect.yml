name: Collect & publish dashboard

on:
  schedule:
    # every 30 minutes (offset from :00 to avoid GitHub's busiest minute)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to run (runner-watchdog sets "hosted" when the Oracle runner is down)'
        type: choice
        options: [self-hosted, hosted]
        default: self-hosted
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'config.yml', '.github/workflows/collect.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ${{ inputs.runner == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ARM64","oracle"]') }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect open issues and PRs
        run: node src/collect.mjs --out site/data.json
        env:
          # RADAR_TOKEN (optional secret) gets a higher rate limit than the built-in token.
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Pages sometimes still reports an earlier deploy as "in progress" after it finished.
      - name: Wait, then retry the deploy once
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 180
      - id: deploy-retry
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
