name: Runner watchdog

# Jobs normally run on the self-hosted Oracle runner (agents-runner). If it is
# down, those jobs would sit in the queue for up to 24h. Every 15 minutes this
# workflow (on a GitHub-hosted runner) looks for Oracle jobs queued longer than
# 10 minutes, cancels them and re-dispatches the workflow with runner=hosted.
# It keeps one "runner offline" issue open while that is happening (you get an
# email) and closes it once a job completes on agents-runner again.
# Uses only the built-in token: no PAT needed.

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write   # cancel + re-dispatch runs
  issues: write    # alert issue
  contents: read

concurrency:
  group: runner-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: runner-offline
      MAX_QUEUED_SECONDS: 600
      RESCUABLE: 'collect.yml digest.yml'
    steps:
      - name: Rescue jobs stuck waiting for agents-runner
        run: |
          set -euo pipefail
          # While an alert is already open the runner is known to be down, so act faster.
          threshold=$MAX_QUEUED_SECONDS
          [ -n "$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')" ] && threshold=120

          # "<run id> <event> <workflow file> <age in s of its oldest queued Oracle job>"
          for status in queued in_progress; do
            gh api "repos/$GH_REPO/actions/runs?status=$status&per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.event) \(.path | split("/") | last)"'
          done | sort -u | while read -r id event wf; do
            case " $RESCUABLE " in *" $wf "*) ;; *) continue ;; esac
            age=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '
              [.jobs[] | select(.status == "queued" and (.labels | index("oracle")))
                | now - (.created_at | fromdateiso8601) | floor] | max // empty')
            [ -n "$age" ] && echo "$id $event $wf $age"
          done > "$RUNNER_TEMP/waiting" || true
          cat "$RUNNER_TEMP/waiting"

          # Runner counts as down if any Oracle job has waited past the threshold.
          if ! awk -v t="$threshold" '$4 > t { found=1 } END { exit !found }' "$RUNNER_TEMP/waiting"; then
            echo "No Oracle job waiting longer than ${threshold}s."
            exit 0
          fi

          # Clear every waiting Oracle job (otherwise younger ones block the
          # workflow's concurrency group), then re-dispatch each workflow once.
          declare -A dispatch=()
          while read -r id event wf age; do
            echo "::warning::Cancelling run $id ($wf, $event): waited ${age}s for agents-runner"
            gh run cancel "$id" || true
            echo "$wf ($event, run $id, waited $((age / 60)) min)" >> "$RUNNER_TEMP/rescued"
            # A manual digest may have used `only`; don't re-send it to everyone.
            if [ "$wf" = digest.yml ] && [ "$event" = workflow_dispatch ]; then
              echo "Not re-dispatching manual digest run $id; re-run it with runner=hosted if needed."
            else
              dispatch[$wf]=1
            fi
          done < "$RUNNER_TEMP/waiting"
          for wf in "${!dispatch[@]}"; do
            gh workflow run "$wf" --ref "${{ github.event.repository.default_branch }}" -f runner=hosted
            echo "Re-dispatched $wf on a GitHub-hosted runner."
          done

      - name: Open or close the alert issue
        run: |
          set -euo pipefail
          open=$(gh issue list --label "$LABEL" --state open --json number,createdAt --jq '.[0] // empty | "\(.number) \(.createdAt)"')
          if [ -s "$RUNNER_TEMP/rescued" ]; then
            if [ -z "$open" ]; then
              {
                echo "Jobs waited more than $((MAX_QUEUED_SECONDS / 60)) minutes for agents-runner, so they were moved to GitHub-hosted runners:"
                echo
                sed 's/^/- /' "$RUNNER_TEMP/rescued"
                echo
                echo "CI keeps working on GitHub-hosted runners meanwhile. This issue closes automatically once a job completes on agents-runner again."
                echo
                echo "Check the VM: \`ssh ubuntu@158.101.198.99 'sudo systemctl status actions.runner.*'\` or re-run \`scripts/setup-oracle-runner.sh\`."
              } > "$RUNNER_TEMP/body"
              gh label create "$LABEL" --color B60205 --description "Self-hosted runner is down" --force >/dev/null
              gh issue create --label "$LABEL" --assignee "$GITHUB_REPOSITORY_OWNER" \
                --title "Self-hosted runner agents-runner is not picking up jobs" \
                --body-file "$RUNNER_TEMP/body"
            fi
            exit 0
          fi
          [ -n "$open" ] || exit 0
          read -r num since <<<"$open"
          # Recovered if any job finished on agents-runner after the issue was opened.
          back=$(gh api "repos/$GH_REPO/actions/runs?status=completed&per_page=10" --jq '.workflow_runs[].id' | while read -r id; do
            SINCE="$since" gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
              --jq '.jobs[] | select(.runner_name == "agents-runner" and .completed_at > $ENV.SINCE) | .id'
          done | head -1 || true)
          if [ -n "$back" ]; then
            gh issue close "$num" --comment "agents-runner is processing jobs again; closing."
          fi
