<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backstage Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1622'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2337d4c4' stroke-width='1.5'/%3E%3Cpath d='M16 16 L27 9' stroke='%2337d4c4' stroke-width='2'/%3E%3Ccircle cx='21' cy='20' r='2.5' fill='%23ff6a4d'/%3E%3C/svg%3E">
<style>
  /* Layout: control-room console. Identity bar → "who is waiting" + radar scope → strip board → area pulse. Dark-first. */
  :root {
    color-scheme: dark;
    --bg: #08111b; --panel: #0e1a27; --panel-2: #132233; --line: #1f3246; --line-2: #2a4259;
    --ink: #e8f0f7; --ink-2: #9fb3c6; --ink-3: #6a8197;
    --scope: #37d4c4;          /* radar phosphor, the accent */
    --scope-dim: rgba(55,212,196,.16);
    --ping: #ff6a4d;           /* someone is waiting on you */
    --rereview: #f5b83d;       /* changes since your review */
    --review: #6aa8ff;         /* review requested */
    --fresh: #b78cff;          /* new in your area */
    --calm: #4c6680;           /* waiting on others / backlog */
    --heat-0: #122131; --heat-1: #12403f; --heat-2: #146b63; --heat-3: #1c9a8b; --heat-4: #37d4c4;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #eef3f7; --panel: #ffffff; --panel-2: #f4f8fb; --line: #d9e3ec; --line-2: #c3d2df;
      --ink: #0b1622; --ink-2: #44586b; --ink-3: #6f8397;
      --scope: #0f8f84; --scope-dim: rgba(15,143,132,.12);
      --ping: #e2472a; --rereview: #b97800; --review: #2f6fd6; --fresh: #7a4fd6; --calm: #8aa0b4;
      --heat-0: #e6edf3; --heat-1: #bfe3dd; --heat-2: #7ccabf; --heat-3: #2fa597; --heat-4: #0f7a70;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef3f7; --panel: #ffffff; --panel-2: #f4f8fb; --line: #d9e3ec; --line-2: #c3d2df;
    --ink: #0b1622; --ink-2: #44586b; --ink-3: #6f8397;
    --scope: #0f8f84; --scope-dim: rgba(15,143,132,.12);
    --ping: #e2472a; --rereview: #b97800; --review: #2f6fd6; --fresh: #7a4fd6; --calm: #8aa0b4;
    --heat-0: #e6edf3; --heat-1: #bfe3dd; --heat-2: #7ccabf; --heat-3: #2fa597; --heat-4: #0f7a70;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--scope); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- identity bar ---------- */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
  .bar-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
  .brand svg { flex: none; }
  .brand small { font: 400 12px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .iam { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 6px 4px 6px; }
  .iam img, .iam .ph { width: 26px; height: 26px; border-radius: 50%; background: var(--panel-2); flex: none; }
  .iam label { font-size: 12px; color: var(--ink-3); }
  .iam input { background: transparent; border: 0; width: 130px; font: 600 14px var(--font-mono); padding: 2px 4px; }
  .iam input::placeholder { color: var(--ink-3); font-weight: 400; }
  .bar .spacer { flex: 1; }
  .fresh { font: 12px var(--font-mono); color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--scope); box-shadow: 0 0 0 3px var(--scope-dim); }
  .fresh.stale i { background: var(--ping); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ping) 25%, transparent); }
  .icon-btn { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .icon-btn:hover { border-color: var(--scope); }

  .areas-row { max-width: 1240px; margin: 0 auto; padding-block: 0 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; }
  .areas-row > span { font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); flex: none; }
  .areas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; min-width: 0; }
  .areas::-webkit-scrollbar { display: none; }
  .area { flex: none; cursor: pointer; border: 1px solid var(--line-2); background: transparent; border-radius: 6px; padding: 3px 10px; font: 500 13px var(--font-mono); color: var(--ink-2); }
  .area:hover { border-color: var(--scope); color: var(--ink); }
  .area[aria-pressed="true"] { background: var(--scope); border-color: var(--scope); color: var(--bg); font-weight: 600; }
  .area.all[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
  .teams { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .teams input { width: 190px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; font: 13px var(--font-mono); }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 28px; padding-block: 28px 8px; align-items: start; }
  .eyebrow { font: 600 11px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--scope); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.6s infinite; }
  .headline { font: 800 clamp(34px, 5.2vw, 60px)/1.0 var(--font-display); letter-spacing: -0.03em; margin: 10px 0 10px; text-wrap: balance; }
  .headline em { font-style: normal; color: var(--ping); }
  .headline.calm em { color: var(--scope); }
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .stats .spark { display: inline-flex; align-items: center; gap: 8px; }

  .people { display: flex; flex-direction: column; gap: 8px; }
  .person { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--ping)); border-radius: 10px; padding: 10px 14px 10px 10px; transition: transform .15s, border-color .15s; }
  .person:hover { transform: translateX(3px); border-color: var(--c, var(--ping)); }
  .person img, .person .ph { width: 44px; height: 44px; border-radius: 50%; background: var(--panel-2); object-fit: cover; }
  .ph { display: grid; place-items: center; font: 700 15px var(--font-mono); color: var(--ink-2); }
  .person .who { font-weight: 600; font-size: 15px; }
  .person .who span { color: var(--c); font-weight: 600; }
  .person .what { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .what .n { font-family: var(--font-mono); color: var(--ink-3); }
  .person .wait { text-align: right; }
  .person .wait b { display: block; font: 600 20px/1 var(--font-mono); color: var(--c); }
  .person .wait small { font-size: 11px; color: var(--ink-3); }
  .person.more { border-left-color: var(--line-2); grid-template-columns: 1fr; text-align: center; color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .allclear { background: var(--panel); border: 1px dashed var(--line-2); border-radius: 12px; padding: 22px; color: var(--ink-2); }

  /* radar */
  .scope-card { background: radial-gradient(circle at 50% 46%, var(--panel-2), var(--panel) 70%); border: 1px solid var(--line); border-radius: 18px; padding: 16px; position: relative; }
  .scope-wrap { position: relative; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 1 / 1; }
  .scope-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sweep { position: absolute; inset: 7%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, var(--scope-dim) 345deg, color-mix(in srgb, var(--scope) 38%, transparent) 360deg); animation: spin 6s linear infinite; pointer-events: none; mix-blend-mode: screen; }
  :root[data-theme="light"] .sweep { mix-blend-mode: multiply; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sweep { mix-blend-mode: multiply; } }
  .blip { cursor: pointer; }
  .blip .halo { animation: pulse 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .blip:hover .core { stroke: var(--ink); stroke-width: 2; }
  .scope-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .scope-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .sweep, .blip .halo, .eyebrow::before { animation: none; } .person { transition: none; } }

  /* ---------- strip board ---------- */
  .section-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 40px 0 12px; }
  .section-h h2 { font: 800 26px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
  .section-h p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: flex; align-items: baseline; gap: 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--ink-2); }
  .tab b { font: 600 18px var(--font-mono); color: var(--ink); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); align-self: center; }
  .tab[aria-selected="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); color: var(--ink); }
  .board-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 12px 0 10px; font-size: 12px; color: var(--ink-3); }
  .board-tools .spacer { flex: 1; }
  .board-tools input[type=search] { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; width: 240px; font-size: 13px; }
  .board-tools label { display: inline-flex; gap: 6px; align-items: center; }
  kbd { font: 11px var(--font-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

  .strips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .strip { display: grid; grid-template-columns: 96px minmax(0, 1fr) 150px 92px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .strip.sel { border-color: var(--scope); box-shadow: 0 0 0 1px var(--scope); }
  .strip.done { opacity: .45; }
  .strip > * { padding: 10px 12px; min-width: 0; }
  .cs { background: color-mix(in srgb, var(--c) 16%, var(--panel)); border-right: 2px dashed color-mix(in srgb, var(--c) 45%, transparent); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .cs b { font: 600 15px var(--font-mono); color: var(--c); }
  .cs small { font: 600 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .st a { text-decoration: none; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st a:hover { color: var(--scope); }
  .st .m { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-2); align-items: center; }
  .act { font: 600 11px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
  .chip { font: 11px var(--font-mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-3); }
  .newtag { font: 600 10px var(--font-mono); letter-spacing: .1em; color: var(--bg); background: var(--ping); border-radius: 3px; padding: 0 5px; }
  .from { display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--line); font-size: 13px; }
  .from img, .from .ph { width: 26px; height: 26px; border-radius: 50%; flex: none; font-size: 11px; background: var(--panel-2); }
  .from span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm { border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; }
  .tm b { font: 600 17px/1 var(--font-mono); }
  .tm b.old { color: var(--ping); }
  .tm button { background: transparent; border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 8px; font-size: 11px; color: var(--ink-2); cursor: pointer; }
  .tm button:hover { border-color: var(--scope); color: var(--ink); }
  .empty-board { padding: 26px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line-2); border-radius: 10px; }
  .more-btn { margin: 10px auto 0; display: block; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 14px; cursor: pointer; }

  /* ---------- pulse ---------- */
  .pulse { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; overflow-x: auto; }
  .pulse svg text { font-family: var(--font-mono); }
  .pulse-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  .ramp { display: inline-flex; gap: 2px; vertical-align: middle; margin: 0 6px; }
  .ramp i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip .k { color: var(--ink-3); font-family: var(--font-mono); }
  footer { margin-top: 36px; color: var(--ink-3); font-size: 12px; }
  footer a { color: var(--ink-2); }

  @media (max-width: 920px) {
    .hero { grid-template-columns: 1fr; }
    .scope-wrap { max-width: 380px; }
    .strip { grid-template-columns: 78px minmax(0, 1fr) 82px; }
    .strip .from { display: none; }
  }
  @media (max-width: 560px) {
    .bar { position: static; }
    .teams { display: none; }
    .areas-row { flex-wrap: wrap; }
    .iam input { width: 110px; }
    .board-tools input[type=search] { width: 100%; }
    .board-tools .keys { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-opacity=".35"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M16 16 L28 9" stroke="var(--scope)" stroke-width="2.2" stroke-linecap="round"/><circle cx="22" cy="21" r="2.6" fill="var(--ping)"/></svg>
      Radar <small id="repo">backstage/backstage</small>
    </div>
    <div class="iam">
      <span class="ph" id="me-ph" aria-hidden="true"></span>
      <label for="user">I am @</label>
      <input id="user" placeholder="your-login" autocomplete="off" spellcheck="false">
    </div>
    <span class="spacer"></span>
    <span class="fresh" id="fresh"><i></i>loading…</span>
    <button class="icon-btn" id="share">Copy my link</button>
    <button class="icon-btn" id="theme" aria-label="Switch light or dark">◐</button>
  </div>
  <div class="areas-row">
    <span>Watching</span>
    <div class="areas" id="areas" role="group" aria-label="Your areas"></div>
    <label class="teams">teams <input id="teams" placeholder="scaffolder-maintainers" autocomplete="off" spellcheck="false"></label>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="tip" id="tip" hidden></div>

<script type="module">
import { classify, humanAge, itemAreas, DAY } from './logic.js';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const lc = (s) => (s || '').toLowerCase();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const csv = (s) => (s || '').split(',').map((x) => x.trim().toLowerCase().replace(/^@?[\w-]+\//, '')).filter(Boolean);
const NEW_DAYS = 7;

// ---------------- state ----------------
const params = new URLSearchParams(location.search);
const saved = store.get('radar:prefs', {});
const state = {
  user: lc(params.get('user') || saved.user || ''),
  areas: params.has('areas') ? csv(params.get('areas')) : saved.areas || [],
  teams: params.has('teams') ? csv(params.get('teams')) : saved.teams || [],
  tab: 'reply', query: '', showDone: false, limit: 40, sel: 0,
};
let data = null, rows = [], boardRows = [], lastVisit = null;

function savePrefs() {
  store.set('radar:prefs', { user: state.user, areas: state.areas, teams: state.teams });
  const q = new URLSearchParams();
  if (state.user) q.set('user', state.user);
  if (state.areas.length) q.set('areas', state.areas.join(','));
  if (state.teams.length) q.set('teams', state.teams.join(','));
  try { history.replaceState(null, '', `${location.pathname}${q.toString() ? `?${q}` : ''}`); } catch { /* sandboxed */ }
}
function readVisit() {
  const key = `radar:lastVisit:${state.user}`;
  lastVisit = store.get(key, null);
  // Only move the marker forward after 20 minutes, so reloads don't wipe "new since last visit".
  if (!lastVisit || Date.now() - Date.parse(lastVisit) > 20 * 60000) store.set(key, new Date().toISOString());
}

// ---------------- model ----------------
const TABS = {
  reply:    { label: 'Waiting on you', c: '--ping' },
  mine:     { label: 'Replies on yours', c: '--review' },
  fresh:    { label: 'New this week', c: '--fresh' },
  activity: { label: 'Replied after you', c: '--rereview' },
  waiting:  { label: 'Ball in their court', c: '--calm' },
  backlog:  { label: 'Backlog', c: '--calm' },
};
const ORDER = Object.keys(TABS);
const ACTION = {
  changes:  { label: 'Re-review', verb: 'wants a re-review', c: '--rereview' },
  review:   { label: 'Review', verb: 'asked for your review', c: '--review' },
  question: { label: 'Question', verb: 'is asking you', c: '--ping' },
  reply:    { label: 'New reply', verb: 'replied', c: '--review' },
  newpr:    { label: 'New PR', verb: 'opened a PR', c: '--fresh' },
  newissue: { label: 'New issue', verb: 'opened an issue', c: '--fresh' },
  waiting:  { label: 'Waiting', verb: 'owes a reply', c: '--calm' },
};
const lastEventAt = (i) => (i.ev.length ? i.ev[i.ev.length - 1][0] : i.created);

function analyse(item, bucket, user) {
  let myReview = null, pushAfter = false, pingKind = null, pinger = null, lastOther = null;
  for (const [at, actor, kind, mentions = [], teams = []] of item.ev) {
    const a = lc(actor);
    if (a === user) { if (kind === 'r') { myReview = at; pushAfter = false; } continue; }
    lastOther = actor;
    if (kind === 'p' && myReview) pushAfter = true;
    if (mentions.includes(user) || teams.some((t) => state.teams.includes(t))) { pingKind = kind; pinger = actor; }
  }
  let action;
  if (bucket === 'reply') action = pushAfter ? 'changes' : (pingKind === 'rr' || (item.t === 'pr' && !pinger)) ? 'review' : 'question';
  else if (bucket === 'mine' || bucket === 'activity') action = pushAfter ? 'changes' : 'reply';
  else if (bucket === 'fresh' || bucket === 'backlog') action = item.t === 'pr' ? 'newpr' : 'newissue';
  else action = 'waiting';
  const who = bucket === 'reply' ? (pinger || item.author) : bucket === 'fresh' || bucket === 'backlog' ? item.author : (lastOther || item.author);
  return { action, who };
}

function build(now) {
  const prefs = { user: state.user, areas: state.areas, teams: state.teams };
  const out = [];
  for (const item of data.items) {
    const c = classify(item, prefs);
    if (!c) continue;
    let bucket = c.bucket;
    if (bucket === 'untouched') bucket = now - Date.parse(lastEventAt(item)) < NEW_DAYS * DAY ? 'fresh' : 'backlog';
    const { action, who } = analyse(item, bucket, prefs.user);
    let myLast = null;
    for (const [at, actor] of item.ev) if (lc(actor) === prefs.user) myLast = at;
    out.push({ item, bucket, since: c.since, action, who, myLast, last: lastEventAt(item), done: isDone(item) });
  }
  const pri = { changes: 0, review: 1, question: 2 };
  out.sort((a, b) => ORDER.indexOf(a.bucket) - ORDER.indexOf(b.bucket)
    || (a.bucket === 'reply' ? (a.since < b.since ? -1 : 1) : 0)
    || (pri[a.action] ?? 9) - (pri[b.action] ?? 9)
    || (a.bucket === 'backlog' ? (a.since < b.since ? -1 : 1) : (b.since > a.since ? 1 : -1)));
  return out;
}

// done
const doneKey = () => `radar:done:${state.user}`;
function isDone(item) { const at = store.get(doneKey(), {})[item.n]; return !!at && at >= lastEventAt(item); }
function toggleDone(item) {
  const all = store.get(doneKey(), {});
  if (isDone(item)) delete all[item.n]; else all[item.n] = lastEventAt(item);
  const open = new Set(data.items.map((i) => String(i.n)));
  for (const k of Object.keys(all)) if (!open.has(k)) delete all[k];
  store.set(doneKey(), all);
  render();
}

// ---------------- radar scope ----------------
const QUADS = [
  { key: 'reply', label: 'WAITING ON YOU', start: -90 },
  { key: 'mine', label: 'YOUR ITEMS', start: 0, also: ['activity'] },
  { key: 'fresh', label: 'NEW IN AREA', start: 90 },
  { key: 'waiting', label: 'THEIR MOVE', start: 180 },
];
function scope(el, now) {
  const S = 520, C = S / 2, R = C * 0.86;
  const RINGS = [{ d: 1, l: '1d' }, { d: 7, l: '1w' }, { d: 28, l: '4w' }, { d: 90, l: '3m' }];
  const rr = (days) => R * Math.min(1, Math.log1p(Math.max(days, 0.02)) / Math.log1p(90));
  const scopeC = css('--scope'), line = css('--line-2'), ink3 = css('--ink-3');
  let g = '';
  // quadrant wash for "waiting on you"
  g += `<path d="M${C},${C} L${C},${C - R} A${R},${R} 0 0 1 ${C + R},${C} Z" fill="${css('--ping')}" opacity="0.06"/>`;
  for (const ring of RINGS) {
    const r = rr(ring.d);
    g += `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="${line}" stroke-dasharray="${ring.d === 90 ? '' : '2 5'}"/>`;
    g += `<text x="${C + 4}" y="${C - r + 13}" font-size="11" fill="${ink3}" style="font-family:var(--font-mono)">${ring.l}</text>`;
  }
  g += `<line x1="${C - R}" y1="${C}" x2="${C + R}" y2="${C}" stroke="${line}"/><line x1="${C}" y1="${C - R}" x2="${C}" y2="${C + R}" stroke="${line}"/>`;
  const labelPos = [[C + R * 0.72, C - R - 10, 'middle'], [C + R * 0.72, C + R + 20, 'middle'], [C - R * 0.72, C + R + 20, 'middle'], [C - R * 0.72, C - R - 10, 'middle']];
  QUADS.forEach((q, i) => {
    const n = rows.filter((r) => !r.done && (r.bucket === q.key || (q.also || []).includes(r.bucket))).length;
    const [x, y, a] = labelPos[i];
    g += `<text x="${x}" y="${y}" text-anchor="${a}" font-size="11" letter-spacing="1.5" font-weight="600" style="font-family:var(--font-mono)" fill="${i === 0 ? css('--ping') : ink3}">${q.label} · ${n}</text>`;
  });
  // you, at the center
  g += `<circle cx="${C}" cy="${C}" r="16" fill="${css('--panel')}" stroke="${scopeC}" stroke-width="2"/>`;
  g += `<clipPath id="me-clip"><circle cx="${C}" cy="${C}" r="14"/></clipPath>`;
  if (state.user) g += `<image href="https://github.com/${encodeURIComponent(state.user)}.png?size=64" x="${C - 14}" y="${C - 14}" width="28" height="28" clip-path="url(#me-clip)"/>`;

  const blips = [];
  for (const r of rows) {
    if (r.done) continue;
    const q = QUADS.find((qq) => qq.key === r.bucket || (qq.also || []).includes(r.bucket));
    if (!q) continue;
    const days = (now - Date.parse(r.bucket === 'reply' ? r.since : r.last)) / DAY;
    const ang = (q.start + 8 + hash(r.item.n) * 74) * Math.PI / 180;
    const rad = rr(days);
    blips.push({ r, x: C + rad * Math.cos(ang), y: C + rad * Math.sin(ang), days });
  }
  // older first so fresh blips sit on top
  blips.sort((a, b) => b.days - a.days);
  for (const [i, b] of blips.entries()) {
    const c = css(ACTION[b.r.action].c);
    const hot = b.r.bucket === 'reply';
    const size = hot ? 7 : b.r.bucket === 'waiting' ? 3.5 : 5;
    g += `<g class="blip" data-i="${i}">${hot ? `<circle class="halo" cx="${b.x}" cy="${b.y}" r="${size}" fill="none" stroke="${c}" stroke-width="2" style="animation-delay:${(hash(b.r.item.n) * 2).toFixed(2)}s"/>` : ''}
      <circle class="core" cx="${b.x}" cy="${b.y}" r="${size}" fill="${c}" ${b.r.bucket === 'waiting' ? 'opacity="0.55"' : ''}/>
      <circle cx="${b.x}" cy="${b.y}" r="${Math.max(12, size + 6)}" fill="transparent"/></g>`;
  }
  el.innerHTML = `<div class="scope-wrap"><div class="sweep"></div><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Radar of items around you">${g}</svg></div>
    <div class="scope-legend">${['question', 'changes', 'review', 'newpr'].map((k) => `<span><i style="background:${css(ACTION[k].c)}"></i>${k === 'newpr' ? 'New in area' : ACTION[k].label}</span>`).join('')}<span><i style="background:${css('--calm')}"></i>Their move</span><span class="mono" style="color:var(--ink-3)">distance = how long</span></div>`;
  el.querySelectorAll('.blip').forEach((node) => {
    const b = blips[+node.dataset.i];
    node.onmousemove = (e) => showTip(e, `<b>#${b.r.item.n} ${esc(b.r.item.title)}</b><span style="color:${css(ACTION[b.r.action].c)}">@${esc(b.r.who)} ${esc(ACTION[b.r.action].verb)}</span> · <span class="k">${humanAge(b.r.bucket === 'reply' ? b.r.since : b.r.last, now)} ago</span>`);
    node.onmouseleave = hideTip;
    node.onclick = () => window.open(b.r.item.url, '_blank', 'noopener');
  });
}

// ---------------- queue history (sparkline) ----------------
function queueHistory(now) {
  const prefs = { user: state.user, areas: state.areas, teams: state.teams };
  const end = new Date(now); end.setUTCHours(23, 59, 59, 999);
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const at = new Date(end.getTime() - i * DAY).toISOString();
    let n = 0;
    for (const item of data.items) {
      if (item.created > at) continue;
      const c = classify({ ...item, reviewers: [], teams: [], ev: item.ev.filter((e) => e[0] <= at) }, prefs);
      if (c && c.bucket === 'reply') n++;
    }
    pts.push(n);
  }
  return pts;
}
function sparkline(pts) {
  const W = 120, H = 28, max = Math.max(1, ...pts);
  const p = pts.map((v, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(H - 3 - (v / max) * (H - 6)).toFixed(1)}`).join(' ');
  const last = p.split(' ').pop().split(',');
  return `<svg width="${W + 6}" height="${H}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${css('--ping')}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${css('--ping')}"/></svg>`;
}

// ---------------- area pulse (heatmap) ----------------
function pulse(el, now) {
  const days = 28;
  const start = new Date(now - (days - 1) * DAY); start.setUTCHours(0, 0, 0, 0);
  const keys = Array.from({ length: days }, (_, i) => new Date(start.getTime() + i * DAY).toISOString().slice(0, 10));
  const scopeAreas = state.areas.includes('all') ? data.areas : state.areas;
  const grid = new Map(), mine = new Map();
  for (const a of scopeAreas) { grid.set(a, keys.map(() => 0)); mine.set(a, keys.map(() => 0)); }
  for (const item of data.items) {
    for (const a of itemAreas(item)) {
      if (!grid.has(a)) continue;
      for (const [at, actor, kind] of item.ev) {
        if (kind === 'rr') continue;
        const k = keys.indexOf(at.slice(0, 10));
        if (k < 0) continue;
        (lc(actor) === state.user ? mine : grid).get(a)[k]++;
      }
    }
  }
  let areas = [...grid.keys()].sort((a, b) => grid.get(b).reduce((s, v) => s + v, 0) - grid.get(a).reduce((s, v) => s + v, 0)).slice(0, 8);
  if (!areas.length) { el.innerHTML = '<p style="color:var(--ink-2);margin:0">Pick at least one area above to see its pulse.</p>'; return; }
  const max = Math.max(1, ...areas.flatMap((a) => grid.get(a)));
  const level = (v) => (v === 0 ? 0 : Math.min(4, 1 + Math.floor((v / max) * 3.999)));
  const cell = 22, gap = 3, L = 120, T = 22;
  const W = L + days * (cell + gap) + 60, H = T + areas.length * (cell + gap) + 4;
  let g = '';
  keys.forEach((k, i) => {
    const d = new Date(`${k}T00:00:00Z`);
    if ((d.getUTCDay() === 1 && i > 2) || (i === 0 && d.getUTCDay() !== 1 && d.getUTCDay() !== 0 && d.getUTCDay() !== 6) || (i === 0 && d.getUTCDay() === 1)) g += `<text x="${L + i * (cell + gap)}" y="13" font-size="10" fill="${css('--ink-3')}">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' })}</text>`;
  });
  areas.forEach((a, r) => {
    const y = T + r * (cell + gap);
    const total = grid.get(a).reduce((s, v) => s + v, 0), yours = mine.get(a).reduce((s, v) => s + v, 0);
    g += `<text x="${L - 10}" y="${y + 15}" text-anchor="end" font-size="12" fill="${css('--ink-2')}">${esc(a)}</text>`;
    grid.get(a).forEach((v, i) => {
      const x = L + i * (cell + gap), m = mine.get(a)[i];
      g += `<rect class="hc" data-a="${esc(a)}" data-i="${i}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${css(`--heat-${level(v)}`)}"/>`;
      if (m) g += `<circle cx="${x + cell / 2}" cy="${y + cell / 2}" r="3.5" fill="${css('--ping')}" pointer-events="none"/>`;
    });
    g += `<text x="${L + days * (cell + gap) + 6}" y="${y + 15}" font-size="11" fill="${css('--ink-3')}">${total}${yours ? ` · ${yours} you` : ''}</text>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Activity per area per day">${g}</svg>
    <div class="pulse-legend"><span>quiet<span class="ramp">${[0, 1, 2, 3, 4].map((l) => `<i style="background:var(--heat-${l})"></i>`).join('')}</span>busy (comments, reviews, pushes by others)</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ping);margin-right:6px"></i>you were active that day</span></div>`;
  el.querySelectorAll('.hc').forEach((node) => {
    const a = node.dataset.a, i = +node.dataset.i;
    node.onmousemove = (e) => showTip(e, `<b>${esc(a)} · ${new Date(`${keys[i]}T00:00:00Z`).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' })}</b><span class="k">${grid.get(a)[i]} events by others · ${mine.get(a)[i]} by you</span>`);
    node.onmouseleave = hideTip;
  });
}

function renderBoard(now) {
  const q = state.query.trim().toLowerCase().replace(/^[#@]/, '');
  const cut = lastVisit ? Date.parse(lastVisit) : now - DAY;
  boardRows = rows.filter((r) => r.bucket === state.tab && (state.showDone || !r.done));
  if (q) boardRows = boardRows.filter((r) => r.item.title.toLowerCase().includes(q) || String(r.item.n).startsWith(q) || lc(r.who).includes(q) || lc(r.item.author).includes(q));
  const ul = $('#strips');
  if (!boardRows.length) { ul.innerHTML = `<li class="empty-board">${state.tab === 'reply' ? 'Nobody is waiting on you here.' : 'Nothing on this board.'}</li>`; return; }
  state.sel = Math.min(state.sel, boardRows.length - 1);
  ul.innerHTML = boardRows.slice(0, state.limit).map((r, i) => {
    const it = r.item, a = ACTION[r.action];
    const ref = r.bucket === 'reply' || r.bucket === 'mine' ? r.since : r.last;
    const waited = (now - Date.parse(ref)) / DAY;
    const isNew = Date.parse(r.last) > cut && r.bucket !== 'waiting';
    return `<li class="strip ${r.done ? 'done' : ''} ${i === state.sel ? 'sel' : ''}" data-i="${i}" style="--c:var(${a.c})">
      <div class="cs"><b>#${it.n}</b><small>${it.t === 'pr' ? (it.draft ? 'draft pr' : 'pr') : 'issue'}</small></div>
      <div class="st"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <div class="m">${isNew ? '<span class="newtag">NEW</span>' : ''}<span class="act">${esc(a.label)}</span>${itemAreas(it).map((x) => `<span class="chip">${esc(x)}</span>`).join('')}${r.myLast && r.bucket !== 'reply' ? `<span>you: ${humanAge(r.myLast, now)} ago</span>` : ''}</div></div>
      <div class="from">${avatar(r.who, 26)}<span>@${esc(r.who)}</span></div>
      <div class="tm"><b class="${waited > 7 && (r.bucket === 'reply' || r.bucket === 'mine') ? 'old' : ''}" title="${esc(new Date(ref).toLocaleString())}">${humanAge(ref, now)}</b><button data-n="${it.n}">${r.done ? 'undo' : 'done'}</button></div>
    </li>`;
  }).join('') + (boardRows.length > state.limit ? `<li><button class="more-btn" id="more">Show ${boardRows.length - state.limit} more</button></li>` : '');
  ul.onclick = (e) => {
    if (e.target.id === 'more') { state.limit += 80; renderBoard(now); return; }
    const n = e.target.closest('button[data-n]')?.dataset.n;
    if (n) toggleDone(data.items.find((i) => String(i.n) === n));
  };
}

addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey || !boardRows.length) return;
  const vis = Math.min(boardRows.length, state.limit);
  if (e.key === 'j' || e.key === 'k') {
    state.sel = Math.max(0, Math.min(vis - 1, state.sel + (e.key === 'j' ? 1 : -1)));
    document.querySelectorAll('#strips .strip').forEach((li) => li.classList.toggle('sel', +li.dataset.i === state.sel));
    document.querySelector(`#strips .strip[data-i="${state.sel}"]`)?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'o') document.querySelector(`#strips .strip[data-i="${state.sel}"] .st a`)?.click();
  else if (e.key === 'd') { const r = boardRows[state.sel]; if (r) toggleDone(r.item); }
});

// ---------------- load ----------------
async function load(first) {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    const repo = data.repo.split(' ')[0];
    for (const i of data.items) i.url ||= `https://github.com/${repo}/${i.t === 'pr' ? 'pull' : 'issues'}/${i.n}`;
    $('#repo').textContent = data.repo;
    const age = (Date.now() - Date.parse(data.generatedAt)) / 60000;
    $('#fresh').innerHTML = `<i></i>${data.items.length} open · scanned ${humanAge(data.generatedAt, Date.now())} ago`;
    $('#fresh').classList.toggle('stale', age > 180);
    if (first) { if (state.user) readVisit(); paintMe(); }
    render();
  } catch (err) {
    $('#fresh').innerHTML = `<i></i>could not load data (${esc(err.message)})`;
    $('#fresh').classList.add('stale');
  }
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
load(true);
setInterval(() => load(false), 5 * 60 * 1000);
</script>
</body>
