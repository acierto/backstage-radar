<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backstage Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171b23'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%233987e5'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%239085e9'/%3E%3Crect x='7' y='21' width='7' height='3' rx='1.5' fill='%23199e70'/%3E%3C/svg%3E">
<style>
  /* Layout: identity bar → "who is waiting" lanes next to an area summary → strip board → area pulse. Calm neutrals, color only for the kind of ask. */
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f7f8fa; --line: #e3e6ec; --line-2: #cdd2db;
    --ink: #121826; --ink-2: #4b5466; --ink-3: #7b8394;
    --accent: #2a5bd7;                         /* UI accent: selection, focus, links */
    --review: #2a78d6;   --review-ink: #1c5cab;
    --rereview: #1baf7a; --rereview-ink: #0b7a55;
    --question: #6250d6; --question-ink: #4a3aa7;
    --fresh: #eda100;    --fresh-ink: #8a5d00;
    --calm: #aab1bd;     --calm-ink: #5d6575;
    --overdue: #b26a00;  --overdue-wash: #fff3dc;
    --track: #eef0f4;
    --heat-0: #eef0f4; --heat-1: #cde2fb; --heat-2: #86b6ef; --heat-3: #3987e5; --heat-4: #1c5cab;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1218; --panel: #171b23; --panel-2: #1d222c; --line: #262c38; --line-2: #343c4b;
      --ink: #e9ecf2; --ink-2: #a9b1c0; --ink-3: #77808f;
      --accent: #6f9cf5;
      --review: #3987e5;   --review-ink: #86b6ef;
      --rereview: #199e70; --rereview-ink: #4fd1a1;
      --question: #9085e9; --question-ink: #b7aef3;
      --fresh: #c98500;    --fresh-ink: #f0b84a;
      --calm: #4a5262;     --calm-ink: #9aa3b2;
      --overdue: #f0b84a;  --overdue-wash: #2d2410;
      --track: #222833;
      --heat-0: #1f2530; --heat-1: #104281; --heat-2: #1c5cab; --heat-3: #3987e5; --heat-4: #86b6ef;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1218; --panel: #171b23; --panel-2: #1d222c; --line: #262c38; --line-2: #343c4b;
    --ink: #e9ecf2; --ink-2: #a9b1c0; --ink-3: #77808f;
    --accent: #6f9cf5;
    --review: #3987e5;   --review-ink: #86b6ef;
    --rereview: #199e70; --rereview-ink: #4fd1a1;
    --question: #9085e9; --question-ink: #b7aef3;
    --fresh: #c98500;    --fresh-ink: #f0b84a;
    --calm: #4a5262;     --calm-ink: #9aa3b2;
    --overdue: #f0b84a;  --overdue-wash: #2d2410;
    --track: #222833;
    --heat-0: #1f2530; --heat-1: #104281; --heat-2: #1c5cab; --heat-3: #3987e5; --heat-4: #86b6ef;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- identity bar ---------- */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
  .bar-in, .areas-row { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar-in { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 18px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
  .brand small { font: 400 12px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .iam { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 8px 4px 5px; }
  .iam img, .iam .ph { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .iam label { font-size: 12px; color: var(--ink-3); }
  .iam input { background: transparent; border: 0; width: 130px; font: 600 14px var(--font-mono); padding: 2px 2px; }
  .iam input::placeholder { color: var(--ink-3); font-weight: 400; }
  .bar .spacer { flex: 1; }
  .fresh { font: 12px var(--font-mono); color: var(--ink-3); }
  .fresh.stale { color: var(--overdue); }
  .icon-btn { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .icon-btn:hover { border-color: var(--accent); }
  a.icon-btn { text-decoration: none; }
  .icon-btn:disabled { opacity: .6; cursor: progress; }
  .areas-row { padding-block: 0 10px; display: flex; align-items: center; gap: 10px; }
  .areas-row > span { font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); flex: none; }
  .areas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; min-width: 0; }
  .areas::-webkit-scrollbar { display: none; }
  .area { flex: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 3px 10px; font: 500 13px var(--font-mono); color: var(--ink-2); }
  .area:hover { border-color: var(--accent); color: var(--ink); }
  .area[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
  .teams { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .teams input { width: 190px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; font: 13px var(--font-mono); }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 28px; padding-block: 28px 0; align-items: start; }
  .eyebrow { font: 600 11px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .headline { font: 800 clamp(30px, 3.4vw, 44px)/1.04 var(--font-display); letter-spacing: -0.03em; margin: 8px 0 12px; text-wrap: balance; }
  .headline em { font-style: normal; color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font: 600 22px/1.1 var(--font-mono); }
  .stat span { font-size: 12px; color: var(--ink-2); }
  .stat.warn { background: var(--overdue-wash); border-color: transparent; }
  .stat.warn b { color: var(--overdue); }
  .stat svg { display: block; margin-top: 4px; }

  .summary .nudge { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 8px; }
  .summary h3 { font: 600 11px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .summary ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .summary li button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
  .summary li button:hover { background: var(--panel); }
  .summary li b { font: 600 15px var(--font-mono); }
  .summary li .bar-mini { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .summary li .bar-mini i { display: block; height: 100%; border-radius: 2px; background: var(--c); }

  /* waiting lanes */
  .lanes { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 12px; }
  .lanes-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
  .lanes-h h2 { margin: 0; font: 800 20px var(--font-display); letter-spacing: -0.01em; }
  .lanes-h p { margin: 0; font-size: 13px; color: var(--ink-2); flex-basis: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .seg button { border: 0; background: var(--panel); padding: 5px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button b { font: 600 13px var(--font-mono); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg button[aria-pressed="true"] b { color: var(--bg); }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 4px; }
  .key i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: 2px; }
  .axis, .lane { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr) 64px; gap: 14px; align-items: center; }
  .axis { font: 11px var(--font-mono); color: var(--ink-3); padding: 6px 0 4px; }
  .axis .ticks { position: relative; height: 14px; }
  .axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis .ticks span:last-child { transform: translateX(-100%); }
  .lane { text-decoration: none; padding: 8px 0; border-top: 1px solid var(--line); }
  .lane:hover .who-name { color: var(--accent); }
  .lane .id { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; }
  .lane img, .lane .ph { width: 34px; height: 34px; border-radius: 50%; }
  .who-name { font-weight: 600; font-size: 14px; }
  .who-act { font: 600 11px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--c-ink); margin-left: 6px; }
  .lane .ttl { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .ttl .n { font-family: var(--font-mono); color: var(--ink-3); }
  .track { position: relative; height: 22px; background: linear-gradient(var(--track), var(--track)) center / 100% 2px no-repeat; }
  .track .grid { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--line); }
  .track .span { position: absolute; top: 5px; height: 12px; border-radius: 6px; background: var(--c); opacity: .9; }
  .track .start { position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 3px solid var(--c); transform: translateX(-50%); }
  .lane .age { text-align: right; font: 600 16px var(--font-mono); }
  .lane .age small { display: block; font: 600 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .lane .age.over { color: var(--overdue); }
  .lane .age.over small { color: var(--overdue); }
  .lanes .more { display: block; width: 100%; margin-top: 4px; padding: 8px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .lanes .more:hover { color: var(--accent); }
  .allclear { padding: 26px 8px; color: var(--ink-2); }
  .allclear b { color: var(--ink); }
  .ph { display: grid; place-items: center; font: 700 12px var(--font-mono); color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); }

  /* ---------- strip board ---------- */
  .section-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 40px 0 12px; }
  .section-h h2 { font: 800 24px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
  .section-h p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: flex; align-items: baseline; gap: 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--ink-2); }
  .tab b { font: 600 17px var(--font-mono); color: var(--ink); }
  .tab[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
  .tab.off { border-style: dashed; color: var(--ink-3); }
  .tab.off b { color: var(--ink-3); }
  .board-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 12px 0 10px; font-size: 12px; color: var(--ink-3); }
  .board-tools .spacer { flex: 1; }
  .search { position: relative; display: flex; align-items: center; width: 270px; }
  .search svg { position: absolute; left: 10px; color: var(--ink-3); pointer-events: none; }
  .search input { width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 30px 7px 32px; font-size: 13px; outline: none; transition: border-color .12s, box-shadow .12s; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search kbd { position: absolute; right: 8px; pointer-events: none; }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }

  .dd { position: relative; }
  .dd-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px 6px 12px; font-size: 13px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .dd-btn:hover, .dd-btn[aria-expanded="true"] { border-color: var(--accent); }
  .dd-btn[aria-expanded="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-btn svg { color: var(--ink-3); transition: transform .15s; }
  .dd-k { color: var(--ink-3); font: 600 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  .dd-v { color: var(--ink); font-weight: 600; }
  .dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 290px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 5px; box-shadow: 0 14px 34px rgba(16, 24, 40, .16), 0 2px 6px rgba(16, 24, 40, .06); outline: none; }
  .dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .dd-opt.active { background: var(--panel-2); }
  .dd-l { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
  .dd-h { display: block; font-size: 12px; color: var(--ink-3); }
  .dd-opt[aria-selected="true"] .dd-l { color: var(--accent); }
  .dd-c { color: var(--accent); width: 14px; flex: none; display: grid; place-items: center; }
  @media (prefers-reduced-motion: no-preference) { .dd-menu:not([hidden]) { animation: dd-in .12s ease-out; } }
  @keyframes dd-in { from { opacity: 0; transform: translateY(-4px); } }

  .sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); user-select: none; }
  .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw-track { position: relative; width: 32px; height: 18px; border-radius: 9px; background: var(--line-2); transition: background .15s; flex: none; }
  .sw-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .sw input:checked + .sw-track { background: var(--accent); }
  .sw input:checked + .sw-track::after { transform: translateX(14px); }
  .sw input:focus-visible + .sw-track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .board-tools label { display: inline-flex; gap: 6px; align-items: center; }
  .board-tools select { font: 13px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--accent); color: var(--ink); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; }
  .filter-chip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); padding: 0 6px; }
  kbd { font: 11px var(--font-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

  .strips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .strip { display: grid; grid-template-columns: 6px 86px minmax(0, 1fr) 160px 84px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .strip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .strip.done { opacity: .45; }
  .strip > * { padding: 10px 12px; min-width: 0; }
  .strip > .edge { padding: 0; background: var(--c); }
  .cs { display: flex; flex-direction: column; justify-content: center; gap: 2px; border-right: 1px dashed var(--line-2); }
  .cs b { font: 600 14px var(--font-mono); }
  .cs small { font: 600 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .st a { text-decoration: none; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st a:hover { color: var(--accent); }
  .st .m { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-2); align-items: center; }
  .act { font: 600 11px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--c-ink); }
  .chip { font: 11px var(--font-mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-3); }
  .newtag { font: 600 10px var(--font-mono); letter-spacing: .1em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; }
  .from { display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--line); font-size: 13px; }
  .from img, .from .ph { width: 24px; height: 24px; border-radius: 50%; flex: none; font-size: 10px; }
  .from span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm { border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; }
  .tm b { font: 600 15px/1 var(--font-mono); }
  .tm b.over { color: var(--overdue); }
  .tm button { background: transparent; border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 8px; font-size: 11px; color: var(--ink-2); cursor: pointer; }
  .tm button:hover { border-color: var(--accent); color: var(--ink); }
  .empty-board { padding: 26px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line-2); border-radius: 10px; }
  .more-btn { margin: 10px auto 0; display: block; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 14px; cursor: pointer; }

  /* ---------- pulse ---------- */
  .pulse { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; overflow-x: auto; }
  .pulse svg text { font-family: var(--font-mono); }
  .pulse-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  .ramp { display: inline-flex; gap: 2px; vertical-align: middle; margin: 0 6px; }
  .ramp i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip .k { color: var(--ink-3); font-family: var(--font-mono); }
  footer { margin-top: 36px; color: var(--ink-3); font-size: 12px; }
  footer a { color: var(--ink-2); }

  @media (max-width: 940px) {
    .hero { display: flex; flex-direction: column; gap: 22px; }
    .hero > .side { display: contents; }
    .hero .intro { order: 1; } .hero .lanes { order: 2; } .hero .summary { order: 3; width: 100%; }
    .hero .stats { margin-bottom: 0; }
    .axis, .lane { grid-template-columns: minmax(0, 200px) minmax(0, 1fr) 56px; }
    .strip { grid-template-columns: 6px 74px minmax(0, 1fr) 80px; }
    .strip .from { display: none; }
  }
  @media (max-width: 600px) {
    .bar { position: static; }
    .teams { display: none; }
    .areas-row { flex-wrap: wrap; }
    .iam input { width: 110px; }
    .axis { display: none; }
    .lane { grid-template-columns: minmax(0, 1fr) 56px; }
    .lane .track { grid-column: 1 / -1; grid-row: 2; }
    .search { width: 100%; }
    .board-tools .keys { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="7" y="9" width="18" height="3" rx="1.5" fill="var(--review)"/><rect x="7" y="15" width="12" height="3" rx="1.5" fill="var(--question)"/><rect x="7" y="21" width="7" height="3" rx="1.5" fill="var(--rereview)"/></svg>
      Radar <small id="repo">backstage/backstage</small>
    </div>
    <div class="iam">
      <span class="ph" id="me-ph" aria-hidden="true"></span>
      <label for="user">I am @</label>
      <input id="user" placeholder="your-login" autocomplete="off" spellcheck="false">
    </div>
    <span class="spacer"></span>
    <span class="fresh" id="fresh">loading…</span>
    <button class="icon-btn" id="refresh" title="Reload the latest scan and hide anything closed since">↻ Refresh</button>
    <a class="icon-btn" id="scan" hidden target="_blank" rel="noopener" title="Open the scan workflow on GitHub and press Run workflow">Scan now ↗</a>
    <button class="icon-btn" id="share">Copy my link</button>
    <button class="icon-btn" id="theme" aria-label="Switch light or dark">◐</button>
  </div>
  <div class="areas-row">
    <span>Watching</span>
    <div class="areas" id="areas" role="group" aria-label="Your areas"></div>
    <label class="teams">teams <input id="teams" placeholder="scaffolder-maintainers" autocomplete="off" spellcheck="false"></label>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="tip" id="tip" hidden></div>

<script type="module">
import { classify, humanAge, itemAreas, DAY } from './logic.js';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const lc = (s) => (s || '').toLowerCase();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const csv = (s) => (s || '').split(',').map((x) => x.trim().toLowerCase().replace(/^@?[\w-]+\//, '')).filter(Boolean);
const NEW_DAYS = 7, OVERDUE_DAYS = 7;

// ---------------- state ----------------
const params = new URLSearchParams(location.search);
const saved = store.get('radar:prefs', {});
const state = {
  user: lc(params.get('user') || saved.user || ''),
  areas: params.has('areas') ? csv(params.get('areas')) : saved.areas || [],
  teams: params.has('teams') ? csv(params.get('teams')) : saved.teams || [],
  tab: 'reply', query: '', showDone: false, limit: 40, sel: 0, filter: null, laneLimit: 7, sort: store.get('radar:sort', 'newest'), lanesMode: store.get('radar:lanes', 'me'),
};
let data = null, rows = [], boardRows = [], lastVisit = null;

function savePrefs() {
  store.set('radar:prefs', { user: state.user, areas: state.areas, teams: state.teams });
  const q = new URLSearchParams();
  if (state.user) q.set('user', state.user);
  if (state.areas.length) q.set('areas', state.areas.join(','));
  if (state.teams.length) q.set('teams', state.teams.join(','));
  try { history.replaceState(null, '', `${location.pathname}${q.toString() ? `?${q}` : ''}`); } catch { /* sandboxed */ }
}
function readVisit() {
  const key = `radar:lastVisit:${state.user}`;
  lastVisit = store.get(key, null);
  // Move the marker only after 20 minutes so reloads don't wipe "new since last visit".
  if (!lastVisit || Date.now() - Date.parse(lastVisit) > 20 * 60000) store.set(key, new Date().toISOString());
}

// ---------------- model ----------------
const TABS = {
  reply: 'Waiting on you', mine: 'Replies on yours', fresh: 'New this week',
  activity: 'Replied after you', waiting: 'Their move', backlog: 'Backlog',
};
const ORDER = Object.keys(TABS);
const AREA_TABS = ['fresh', 'activity', 'waiting', 'backlog'];
const noAreas = () => !state.areas.length;
const NO_AREA_MSG = 'This tab shows items in the areas you watch. Pick at least one area in the Watching bar at the top.';
const ACTION = {
  changes:  { label: 'Re-review', verb: 'wants a re-review', c: 'rereview' },
  review:   { label: 'Review', verb: 'asked for your review', c: 'review' },
  question: { label: 'Question', verb: 'is asking you', c: 'question' },
  reply:    { label: 'New reply', verb: 'replied', c: 'review' },
  newpr:    { label: 'New PR', verb: 'opened a PR', c: 'fresh' },
  newissue: { label: 'New issue', verb: 'opened an issue', c: 'fresh' },
  waiting:  { label: 'Their move', verb: 'owes a reply', c: 'calm' },
};
const colorVars = (a) => `--c:var(--${ACTION[a].c});--c-ink:var(--${ACTION[a].c}-ink)`;
const lastEventAt = (i) => (i.ev.length ? i.ev[i.ev.length - 1][0] : i.created);
// The time a strip shows: when they asked (waiting/your items) or the latest activity (everything else).
const refTime = (r) => (r.bucket === 'reply' || r.bucket === 'mine' ? r.since : r.last);
const SORTS = {
  newest:   { label: 'Newest first', hint: 'Latest ask or activity on top', cmp: (a, b) => (refTime(b) > refTime(a) ? 1 : refTime(b) < refTime(a) ? -1 : 0) },
  oldest:   { label: 'Oldest first', hint: 'Longest waiting on top', cmp: (a, b) => (refTime(a) > refTime(b) ? 1 : refTime(a) < refTime(b) ? -1 : 0) },
  active:   { label: 'Most active', hint: 'Most comments, reviews and pushes', cmp: (a, b) => b.item.ev.length - a.item.ev.length },
  number:   { label: 'Issue number', hint: 'Highest number first', cmp: (a, b) => b.item.n - a.item.n },
};

function analyse(item, bucket, user) {
  let myReview = null, pushAfter = false, pingKind = null, pinger = null, lastOther = null;
  for (const [at, actor, kind, mentions = [], teams = []] of item.ev) {
    const a = lc(actor);
    if (a === user) { if (kind === 'r') { myReview = at; pushAfter = false; } continue; }
    lastOther = actor;
    if (kind === 'p' && myReview) pushAfter = true;
    if (mentions.includes(user) || teams.some((t) => state.teams.includes(t))) { pingKind = kind; pinger = actor; }
  }
  let action;
  if (bucket === 'reply') action = pushAfter ? 'changes' : (pingKind === 'rr' || (item.t === 'pr' && !pinger)) ? 'review' : 'question';
  else if (bucket === 'mine' || bucket === 'activity') action = pushAfter ? 'changes' : 'reply';
  else if (bucket === 'fresh' || bucket === 'backlog') action = item.t === 'pr' ? 'newpr' : 'newissue';
  else action = 'waiting';
  const who = bucket === 'reply' ? (pinger || item.author) : bucket === 'fresh' || bucket === 'backlog' ? item.author : (lastOther || item.author);
  return { action, who };
}

function build(now) {
  const prefs = { user: state.user, areas: state.areas, teams: state.teams };
  const out = [];
  for (const item of data.items) {
    const c = classify(item, prefs);
    if (!c) continue;
    let bucket = c.bucket;
    if (bucket === 'untouched') bucket = now - Date.parse(lastEventAt(item)) < NEW_DAYS * DAY ? 'fresh' : 'backlog';
    const { action, who } = analyse(item, bucket, prefs.user);
    let myLast = null;
    for (const [at, actor] of item.ev) if (lc(actor) === prefs.user) myLast = at;
    out.push({ item, bucket, since: c.since, action, who, myLast, last: lastEventAt(item), done: isDone(item) });
  }
  out.sort((a, b) => ORDER.indexOf(a.bucket) - ORDER.indexOf(b.bucket)
    || (['reply', 'mine', 'backlog'].includes(a.bucket) ? (a.since < b.since ? -1 : 1) : (b.last > a.last ? 1 : -1)));
  return out;
}

// done
const doneKey = () => `radar:done:${state.user}`;
function isDone(item) { const at = store.get(doneKey(), {})[item.n]; return !!at && at >= lastEventAt(item); }
function toggleDone(item) {
  const all = store.get(doneKey(), {});
  if (isDone(item)) delete all[item.n]; else all[item.n] = lastEventAt(item);
  const open = new Set(data.items.map((i) => String(i.n)));
  for (const k of Object.keys(all)) if (!open.has(k)) delete all[k];
  store.set(doneKey(), all);
  render();
}

// ---------------- helpers ----------------
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const avatar = (login, size) => {
  const ini = esc((login || '?').slice(0, 2).toUpperCase());
  if (!login || /\[bot\]$/.test(login)) return `<span class="ph">${ini}</span>`;
  return `<img src="https://github.com/${encodeURIComponent(login)}.png?size=${size * 2}" alt="" width="${size}" height="${size}" loading="lazy" onerror="this.outerHTML='<span class=&quot;ph&quot;>${ini}</span>'">`;
};
const ageWords = (since, now) => { const s = humanAge(since, now); return { v: s.replace(/[a-z]+$/, ''), u: { m: 'min', h: 'hours', d: 'days', w: 'weeks' }[s.replace(/^\d+/, '')] || '' }; };
const tip = $('#tip');
function showTip(e, html) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 16;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 16;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
const hideTip = () => { tip.hidden = true; };

// ---------------- identity bar ----------------
{ const t = store.get('radar:theme', null); if (t) document.documentElement.dataset.theme = t; }
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  store.set('radar:theme', document.documentElement.dataset.theme);
  render();
};
$('#share').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('#share').textContent = 'Link copied'; }
  catch { $('#share').textContent = 'Copy from address bar'; }
  setTimeout(() => { $('#share').textContent = 'Copy my link'; }, 1600);
};
const userEl = $('#user'), teamsEl = $('#teams');
userEl.value = state.user; teamsEl.value = state.teams.join(', ');
function paintMe() { $('#me-ph').outerHTML = `<span id="me-ph" style="display:contents">${state.user ? avatar(state.user, 26) : '<span class="ph"></span>'}</span>`; }
let typing;
userEl.oninput = () => { clearTimeout(typing); typing = setTimeout(() => { state.user = lc(userEl.value.trim().replace(/^@/, '')); savePrefs(); readVisit(); paintMe(); paintScanLink(); render(); }, 400); };
teamsEl.oninput = () => { clearTimeout(typing); typing = setTimeout(() => { state.teams = csv(teamsEl.value); savePrefs(); render(); }, 400); };

function renderAreas() {
  const all = state.areas.includes('all');
  const sel = data.areas.filter((a) => !all && state.areas.includes(a));
  const rest = data.areas.filter((a) => all || !state.areas.includes(a));
  $('#areas').innerHTML = [`<button class="area" data-a="all" aria-pressed="${all}">all areas</button>`]
    .concat([...sel, ...rest].map((a) => `<button class="area" data-a="${esc(a)}" aria-pressed="${!all && state.areas.includes(a)}">${esc(a)}</button>`)).join('');
  $('#areas').onclick = (e) => {
    const a = e.target.closest('.area')?.dataset.a; if (!a) return;
    if (a === 'all') state.areas = all ? [] : ['all'];
    else { const s = new Set(state.areas.filter((x) => x !== 'all')); s.has(a) ? s.delete(a) : s.add(a); state.areas = [...s]; }
    state.filter = null; savePrefs(); render();
  };
}

// ---------------- waiting lanes ----------------
// Shared time axis, log-scaled so a 2-hour ping and a 10-week ping are both readable. Right edge = now.
const AXIS_DAYS = 120;
const xPos = (days) => 100 * (1 - Math.log1p(Math.max(0, days)) / Math.log1p(AXIS_DAYS));
const TICKS = [[AXIS_DAYS, '4 months'], [28, '4w'], [7, '1w'], [1, '1d'], [0, 'now']];

function lanes(now) {
  const forMe = rows.filter((r) => r.bucket === 'reply' && !r.done);
  const forArea = rows.filter((r) => (r.bucket === 'fresh' || r.bucket === 'activity') && !r.done);
  const mode = state.lanesMode === 'areas' ? 'areas' : 'me';
  const waiting = [...(mode === 'me' ? forMe : forArea)].sort((a, b) => (b.since > a.since ? 1 : b.since < a.since ? -1 : 0));
  const toggle = `<div class="seg" role="group" aria-label="Show">
      <button data-lanes="me" aria-pressed="${mode === 'me'}">For me <b>${forMe.length}</b></button>
      <button data-lanes="areas" aria-pressed="${mode === 'areas'}">My areas <b>${forArea.length}</b></button></div>`;
  if (!waiting.length) {
    return `<div class="lanes"><div class="lanes-h"><h2>Who is waiting</h2>${toggle}</div>
      <div class="allclear">${mode === 'me' ? `Nobody is waiting on you. <b>${forArea.length}</b> items in your areas could use a look: switch to <b>My areas</b>.` : 'Nothing new or unanswered in your areas this week.'}</div></div>`;
  }
  const kinds = ['question', 'changes', 'review', 'reply', 'newpr', 'newissue'].filter((k) => waiting.some((r) => r.action === k));
  const shown = waiting.slice(0, state.laneLimit);
  const grid = TICKS.slice(1, -1).map(([d]) => `<span class="grid" style="left:${xPos(d)}%"></span>`).join('');
  const lane = (r) => {
    const days = (now - Date.parse(r.since)) / DAY, a = ACTION[r.action], w = ageWords(r.since, now), over = mode === 'me' && days > OVERDUE_DAYS;
    const left = xPos(days);
    return `<a class="lane" href="${esc(r.item.url)}" target="_blank" rel="noopener" style="${colorVars(r.action)}">
      <div class="id">${avatar(r.who, 34)}<div style="min-width:0"><div><span class="who-name">@${esc(r.who)}</span><span class="who-act">${esc(a.label)}</span></div>
        <div class="ttl"><span class="n">#${r.item.n}</span> ${esc(r.item.title)}</div></div></div>
      <div class="track">${grid}<span class="span" style="left:${left}%;right:0"></span><span class="start" style="left:${left}%"></span></div>
      <div class="age ${over ? 'over' : ''}">${over ? humanAge(r.since, now) : w.v}<small>${over ? 'overdue' : w.u}</small></div></a>`;
  };
  return `<div class="lanes">
    <div class="lanes-h"><h2>Who is waiting</h2>${toggle}<p>${mode === 'me' ? 'Asked you directly' : 'New or unanswered in your areas'} · newest first · the bar runs from ${mode === 'me' ? 'when they asked' : 'their last message'} to now</p></div>
    <div class="key">${kinds.map((k) => `<span><i style="background:var(--${ACTION[k].c})"></i>${ACTION[k].label}</span>`).join('')}${mode === 'me' ? `<span>· overdue after ${OVERDUE_DAYS} days</span>` : ''}</div>
    <div class="axis"><span></span><div class="ticks">${TICKS.map(([d, l]) => `<span style="left:${xPos(d)}%">${l}</span>`).join('')}</div><span></span></div>
    ${shown.map(lane).join('')}
    ${waiting.length > shown.length ? `<button class="more" id="lanes-more">Show ${waiting.length - shown.length} more</button>` : ''}
  </div>`;
}

// ---------------- area summary ----------------
function areaFacts(now) {
  const scope = data.items.filter((i) => {
    const a = itemAreas(i);
    return state.areas.includes('all') ? a.length : a.some((x) => state.areas.includes(x));
  });
  const reviewed = (i) => i.ev.some((e) => e[2] === 'r' && lc(e[1]) !== lc(i.author));
  const quiet = (i) => now - Date.parse(lastEventAt(i)) > 30 * DAY;
  const facts = [
    { key: 'fresh', label: 'New this week', test: (r) => r.bucket === 'fresh', c: 'fresh' },
    { key: 'noreview', label: 'PRs with no review yet', test: (r) => r.item.t === 'pr' && !r.item.draft && !reviewed(r.item), c: 'review' },
    { key: 'triage', label: 'Issues needing triage', test: (r) => r.item.t === 'issue' && r.item.labels.some((l) => /triage/i.test(l)), c: 'question' },
    { key: 'quiet', label: 'Quiet for 30+ days', test: (r) => quiet(r.item), c: 'calm' },
  ];
  const inScope = new Set(scope.map((i) => i.n));
  const areaRows = rows.filter((r) => inScope.has(r.item.n) && !r.done);
  for (const f of facts) f.n = areaRows.filter(f.test).length;
  return { facts, total: scope.length };
}

// ---------------- area pulse (heatmap) ----------------
function pulse(el, now) {
  const days = 28;
  const start = new Date(now - (days - 1) * DAY); start.setUTCHours(0, 0, 0, 0);
  const keys = Array.from({ length: days }, (_, i) => new Date(start.getTime() + i * DAY).toISOString().slice(0, 10));
  const scopeAreas = state.areas.includes('all') ? data.areas : state.areas;
  const grid = new Map(), mine = new Map();
  for (const a of scopeAreas) { grid.set(a, keys.map(() => 0)); mine.set(a, keys.map(() => 0)); }
  for (const item of data.items) {
    for (const a of itemAreas(item)) {
      if (!grid.has(a)) continue;
      for (const [at, actor, kind] of item.ev) {
        if (kind === 'rr') continue;
        const k = keys.indexOf(at.slice(0, 10));
        if (k >= 0) (lc(actor) === state.user ? mine : grid).get(a)[k]++;
      }
    }
  }
  const areas = [...grid.keys()].sort((a, b) => grid.get(b).reduce((s, v) => s + v, 0) - grid.get(a).reduce((s, v) => s + v, 0)).slice(0, 8);
  if (!areas.length) { el.innerHTML = '<p style="color:var(--ink-2);margin:0">Pick at least one area above to see its pulse.</p>'; return; }
  const max = Math.max(1, ...areas.flatMap((a) => grid.get(a)));
  const level = (v) => (v === 0 ? 0 : Math.min(4, 1 + Math.floor((v / max) * 3.999)));
  const cell = 22, gap = 3, L = 120, T = 22;
  const W = L + days * (cell + gap) + 120, H = T + areas.length * (cell + gap) + 4;
  let g = '';
  keys.forEach((k, i) => {
    const d = new Date(`${k}T00:00:00Z`);
    if (d.getUTCDay() === 1 && i < days - 2) g += `<text x="${L + i * (cell + gap)}" y="13" font-size="10" fill="${css('--ink-3')}">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' })}</text>`;
  });
  areas.forEach((a, r) => {
    const y = T + r * (cell + gap);
    const total = grid.get(a).reduce((s, v) => s + v, 0), yours = mine.get(a).reduce((s, v) => s + v, 0);
    g += `<text x="${L - 10}" y="${y + 15}" text-anchor="end" font-size="12" fill="${css('--ink-2')}">${esc(a)}</text>`;
    grid.get(a).forEach((v, i) => {
      const x = L + i * (cell + gap), m = mine.get(a)[i];
      g += `<rect class="hc" data-a="${esc(a)}" data-i="${i}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${css(`--heat-${level(v)}`)}"/>`;
      if (m) g += `<rect x="${x + 7}" y="${y + cell - 5}" width="${cell - 14}" height="3" rx="1.5" fill="${css('--ink')}" pointer-events="none"/>`;
    });
    g += `<text x="${L + days * (cell + gap) + 6}" y="${y + 15}" font-size="11" fill="${css('--ink-3')}">${total}${yours ? ` · ${yours} you` : ''}</text>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Activity per area per day">${g}</svg>
    <div class="pulse-legend"><span>quiet<span class="ramp">${[0, 1, 2, 3, 4].map((l) => `<i style="background:var(--heat-${l})"></i>`).join('')}</span>busy (comments, reviews, pushes by others)</span><span><i style="display:inline-block;width:12px;height:3px;border-radius:2px;background:var(--ink);margin-right:6px;vertical-align:3px"></i>you were active that day</span></div>`;
  el.querySelectorAll('.hc').forEach((node) => {
    const a = node.dataset.a, i = +node.dataset.i;
    node.onmousemove = (e) => showTip(e, `<b>${esc(a)} · ${new Date(`${keys[i]}T00:00:00Z`).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' })}</b><span class="k">${grid.get(a)[i]} by others · ${mine.get(a)[i]} by you</span>`);
    node.onmouseleave = hideTip;
  });
}

// ---------------- queue history ----------------
function queueHistory(now) {
  const prefs = { user: state.user, areas: state.areas, teams: state.teams };
  const end = new Date(now); end.setUTCHours(23, 59, 59, 999);
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const at = new Date(end.getTime() - i * DAY).toISOString();
    let n = 0;
    for (const item of data.items) {
      if (item.created > at) continue;
      const c = classify({ ...item, reviewers: [], teams: [], ev: item.ev.filter((e) => e[0] <= at) }, prefs);
      if (c && c.bucket === 'reply') n++;
    }
    pts.push(n);
  }
  return pts;
}
function sparkline(pts) {
  const W = 110, H = 24, max = Math.max(1, ...pts);
  const p = pts.map((v, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(H - 3 - (v / max) * (H - 6)).toFixed(1)}`).join(' ');
  const last = p.split(' ').pop().split(',');
  return `<svg width="${W + 4}" height="${H}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${css('--accent')}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${css('--accent')}"/></svg>`;
}

// ---------------- sort dropdown (custom listbox) ----------------
const CHEVRON = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.5L11 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function dropdown() {
  const cur = SORTS[state.sort] || SORTS.newest;
  return `<div class="dd" id="sort-dd">
    <button type="button" class="dd-btn" id="sort-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-menu">
      <span class="dd-k">Sort</span><span class="dd-v">${esc(cur.label)}</span>${CHEVRON}</button>
    <div class="dd-menu" id="sort-menu" role="listbox" aria-label="Sort the board" tabindex="-1" hidden>
      ${Object.entries(SORTS).map(([k, v]) => `<div class="dd-opt" role="option" id="sort-opt-${k}" data-v="${k}" aria-selected="${state.sort === k}">
        <span><span class="dd-l">${esc(v.label)}</span><span class="dd-h">${esc(v.hint)}</span></span><span class="dd-c">${state.sort === k ? CHECK : ''}</span></div>`).join('')}
    </div></div>`;
}
let closeOpenDropdown = null;
function wireDropdown(onPick) {
  const btn = $('#sort-btn'), menu = $('#sort-menu');
  const opts = [...menu.querySelectorAll('.dd-opt')];
  let active = Math.max(0, opts.findIndex((o) => o.dataset.v === state.sort));
  const paint = () => { opts.forEach((o, i) => o.classList.toggle('active', i === active)); menu.setAttribute('aria-activedescendant', opts[active].id); };
  const open = () => { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); active = Math.max(0, opts.findIndex((o) => o.dataset.v === state.sort)); paint(); menu.focus(); closeOpenDropdown = close; };
  const close = (refocus = true) => { if (menu.hidden) return; menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); closeOpenDropdown = null; if (refocus) btn.focus(); };
  const pick = (i) => {
    const v = opts[i].dataset.v;
    close();
    if (v === state.sort) return;
    opts.forEach((o) => { const on = o.dataset.v === v; o.setAttribute('aria-selected', on); o.querySelector('.dd-c').innerHTML = on ? CHECK : ''; });
    btn.querySelector('.dd-v').textContent = SORTS[v].label;
    onPick(v);
  };
  btn.onclick = () => (menu.hidden ? open() : close());
  btn.onkeydown = (e) => { if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); open(); } };
  menu.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { active = (active + 1) % opts.length; paint(); }
    else if (e.key === 'ArrowUp') { active = (active - 1 + opts.length) % opts.length; paint(); }
    else if (e.key === 'Home') { active = 0; paint(); }
    else if (e.key === 'End') { active = opts.length - 1; paint(); }
    else if (e.key === 'Enter' || e.key === ' ') pick(active);
    else if (e.key === 'Escape') close();
    else if (e.key === 'Tab') { close(false); return; }
    else return;
    e.preventDefault(); e.stopPropagation();
  };
  opts.forEach((o, i) => { o.onmousemove = () => { if (active !== i) { active = i; paint(); } }; o.onclick = () => pick(i); });
}
document.addEventListener('mousedown', (e) => { if (closeOpenDropdown && !e.target.closest('.dd')) closeOpenDropdown(false); });

// ---------------- render ----------------
function render() {
  if (!data) return;
  // Keep the reader where they are: rebuilding the page must never move the scroll position.
  const y = scrollY;
  renderInner();
  scrollTo({ top: y, behavior: 'instant' });
}

function renderInner() {
  renderAreas();
  const now = Date.now();
  const main = $('#main');
  if (!state.user) {
    main.innerHTML = `<section class="hero" style="grid-template-columns:1fr"><div><div class="eyebrow">Get started</div>
      <h1 class="headline">Who's waiting on <em>you</em>?</h1>
      <p style="color:var(--ink-2)">Type your GitHub login in the bar above and pick the areas you look after. Your choice is kept in this browser and in the page link.</p></div></section>`;
    userEl.focus();
    return;
  }
  rows = build(now);
  const live = rows.filter((r) => !r.done);
  const waiting = live.filter((r) => r.bucket === 'reply');
  document.title = waiting.length ? `(${waiting.length}) Backstage Radar` : 'Backstage Radar';
  const people = new Set(waiting.map((r) => lc(r.who))).size;
  const overdue = waiting.filter((r) => now - Date.parse(r.since) > OVERDUE_DAYS * DAY).length;
  const hist = queueHistory(now);
  const cut = lastVisit ? Date.parse(lastVisit) : now - DAY;
  const newSince = live.filter((r) => r.bucket !== 'waiting' && r.bucket !== 'backlog' && Date.parse(r.last) > cut).length;
  const { facts, total } = areaFacts(now);
  const fmax = Math.max(1, ...facts.map((f) => f.n));
  const areaName = state.areas.includes('all') ? 'all areas' : state.areas.join(', ') || 'no areas';

  main.innerHTML = `
    <section class="hero">
      <div class="side">
        <div class="intro">
          <div class="eyebrow">Right now</div>
          <h1 class="headline">${waiting.length ? `<em>${people} ${people === 1 ? 'person' : 'people'}</em> waiting on you` : 'All <em>clear</em>'}</h1>
          <div class="stats">
            <div class="stat ${overdue ? 'warn' : ''}"><b>${overdue}</b><span>overdue (${OVERDUE_DAYS}+ days)</span></div>
            <div class="stat"><b>${newSince}</b><span>new since last visit</span></div>
            <div class="stat" style="grid-column:1/-1"><b>${waiting.length} <span style="font:400 12px var(--font-body);color:var(--ink-2)">open asks · was ${hist[0]} a month ago</span></b>${sparkline(hist)}</div>
          </div>
        </div>
        <div class="summary">
          <h3>${noAreas() ? 'Your areas' : `In ${esc(areaName)} · ${total} open`}</h3>${noAreas() ? '<p class="nudge">Pick the areas you look after in the <b>Watching</b> bar at the top to see what needs attention there.</p>' : ''}
          <ul>${facts.map((f) => `<li><button data-fact="${f.key}" style="--c:var(--${f.c})"><span>${esc(f.label)}</span><b>${f.n}</b><span class="bar-mini"><i style="width:${(f.n / fmax) * 100}%"></i></span></button></li>`).join('')}</ul>
        </div>
      </div>
      ${lanes(now)}
    </section>

    <div class="section-h" id="board"><h2>Board</h2><p>Everything in your scope, one strip per item.</p></div>
    <div class="tabs" role="tablist">${ORDER.map((k) => {
      const off = noAreas() && AREA_TABS.includes(k);
      return `<button class="tab ${off ? 'off' : ''}" role="tab" data-tab="${k}" aria-selected="${state.tab === k && !state.filter}" ${off ? `title="${esc(NO_AREA_MSG)}"` : ''}>${TABS[k]}<b>${off ? '–' : live.filter((r) => r.bucket === k).length}</b></button>`;
    }).join('')}</div>
    <div class="board-tools">${state.filter ? `<span class="filter-chip">${esc(facts.find((f) => f.key === state.filter).label)}<button id="clear-filter" aria-label="Clear filter">×</button></span>` : ''}
      <div class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Filter by title, #number, person" value="${esc(state.query)}" aria-label="Filter the board"><kbd aria-hidden="true">/</kbd></div>
      ${dropdown()}
      <label class="sw"><input type="checkbox" id="show-done" ${state.showDone ? 'checked' : ''}><span class="sw-track" aria-hidden="true"></span>show done</label><span class="spacer"></span>
      <span class="keys"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>o</kbd> open · <kbd>d</kbd> done</span></div>
    <ul class="strips" id="strips"></ul>

    <div class="section-h"><h2>Area pulse</h2><p>Last 4 weeks of activity in the areas you watch.</p></div>
    <div class="pulse" id="pulse"></div>
    <footer>Data from <a href="https://github.com/${esc(data.repo.split(' ')[0])}" target="_blank" rel="noopener">${esc(data.repo)}</a>, refreshed every 30 minutes. "Done", your settings and your last visit live in this browser only. <a href="classic.html${esc(location.search)}">Classic view</a></footer>`;

  const toBoard = () => $('#board').scrollIntoView({ behavior: 'smooth', block: 'start' });
  // Tabs only swap the list below them: no re-render, no scrolling.
  main.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
    state.tab = b.dataset.tab; state.sel = 0; state.limit = 40;
    if (state.filter) { state.filter = null; $('.filter-chip')?.remove(); }
    main.querySelectorAll('[data-tab]').forEach((t) => t.setAttribute('aria-selected', t === b));
    // A shorter list must not pull the page up under the pointer.
    const ul = $('#strips'); ul.style.minHeight = `${ul.offsetHeight}px`;
    renderBoard(now, facts);
  }));
  main.querySelectorAll('[data-fact]').forEach((b) => (b.onclick = () => { state.filter = b.dataset.fact; state.sel = 0; state.limit = 40; render(); toBoard(); }));
  $('#clear-filter')?.addEventListener('click', () => { state.filter = null; render(); });
  $('#lanes-more')?.addEventListener('click', () => { state.laneLimit += 20; render(); });
  main.querySelectorAll('[data-lanes]').forEach((b) => (b.onclick = () => { state.lanesMode = b.dataset.lanes; state.laneLimit = 7; store.set('radar:lanes', state.lanesMode); render(); }));
  $('#q').oninput = (e) => { state.query = e.target.value; state.sel = 0; renderBoard(now, facts); };
  $('#show-done').onchange = (e) => { state.showDone = e.target.checked; renderBoard(now, facts); };
  wireDropdown((value) => {
    state.sort = value; state.sel = 0; store.set('radar:sort', state.sort);
    const ul = $('#strips'); ul.style.minHeight = `${ul.offsetHeight}px`;
    renderBoard(now, facts);
  });
  renderBoard(now, facts);
  pulse($('#pulse'), now);
}

function renderBoard(now, facts) {
  const q = state.query.trim().toLowerCase().replace(/^[#@]/, '');
  const cut = lastVisit ? Date.parse(lastVisit) : now - DAY;
  if (state.filter) {
    const f = facts.find((x) => x.key === state.filter);
    const scope = new Set(data.items.filter((i) => { const a = itemAreas(i); return state.areas.includes('all') ? a.length : a.some((x) => state.areas.includes(x)); }).map((i) => i.n));
    boardRows = rows.filter((r) => scope.has(r.item.n) && f.test(r) && (state.showDone || !r.done));
  } else {
    boardRows = rows.filter((r) => r.bucket === state.tab && (state.showDone || !r.done));
  }
  if (q) boardRows = boardRows.filter((r) => r.item.title.toLowerCase().includes(q) || String(r.item.n).startsWith(q) || lc(r.who).includes(q) || lc(r.item.author).includes(q));
  boardRows = [...boardRows].sort(SORTS[state.sort]?.cmp || SORTS.newest.cmp);
  const ul = $('#strips');
  if (!boardRows.length) {
    const msg = !state.filter && noAreas() && AREA_TABS.includes(state.tab) ? NO_AREA_MSG : state.tab === 'reply' && !state.filter ? 'Nobody is waiting on you.' : 'Nothing here.';
    ul.innerHTML = `<li class="empty-board">${esc(msg)}</li>`; return;
  }
  state.sel = Math.min(state.sel, boardRows.length - 1);
  ul.innerHTML = boardRows.slice(0, state.limit).map((r, i) => {
    const it = r.item, a = ACTION[r.action];
    const ref = r.bucket === 'reply' || r.bucket === 'mine' ? r.since : r.last;
    const days = (now - Date.parse(ref)) / DAY;
    const over = days > OVERDUE_DAYS && (r.bucket === 'reply' || r.bucket === 'mine');
    const isNew = Date.parse(r.last) > cut && r.bucket !== 'waiting';
    return `<li class="strip ${r.done ? 'done' : ''} ${i === state.sel ? 'sel' : ''}" data-i="${i}" style="${colorVars(r.action)}">
      <span class="edge"></span>
      <div class="cs"><b>#${it.n}</b><small>${it.t === 'pr' ? (it.draft ? 'draft pr' : 'pr') : 'issue'}</small></div>
      <div class="st"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <div class="m">${isNew ? '<span class="newtag">NEW</span>' : ''}<span class="act">${esc(a.label)}</span>${itemAreas(it).map((x) => `<span class="chip">${esc(x)}</span>`).join('')}${r.myLast && r.bucket !== 'reply' ? `<span>you: ${humanAge(r.myLast, now)} ago</span>` : ''}</div></div>
      <div class="from">${avatar(r.who, 24)}<span>@${esc(r.who)}</span></div>
      <div class="tm"><b class="${over ? 'over' : ''}" title="${esc(new Date(ref).toLocaleString())}">${humanAge(ref, now)}</b><button data-n="${it.n}">${r.done ? 'undo' : 'done'}</button></div>
    </li>`;
  }).join('') + (boardRows.length > state.limit ? `<li><button class="more-btn" id="more">Show ${boardRows.length - state.limit} more</button></li>` : '');
  ul.onclick = (e) => {
    if (e.target.id === 'more') { state.limit += 80; renderBoard(now, facts); return; }
    const n = e.target.closest('button[data-n]')?.dataset.n;
    if (n) toggleDone(data.items.find((i) => String(i.n) === n));
  };
}

addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.matches('input, textarea')) { e.preventDefault(); $('#q')?.focus(); return; }
  if (e.target.matches('input, textarea') || e.target.closest?.('.dd') || e.metaKey || e.ctrlKey || e.altKey || !boardRows.length) return;
  const vis = Math.min(boardRows.length, state.limit);
  if (e.key === 'j' || e.key === 'k') {
    state.sel = Math.max(0, Math.min(vis - 1, state.sel + (e.key === 'j' ? 1 : -1)));
    document.querySelectorAll('#strips .strip').forEach((li) => li.classList.toggle('sel', +li.dataset.i === state.sel));
    document.querySelector(`#strips .strip[data-i="${state.sel}"]`)?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'o') document.querySelector(`#strips .strip[data-i="${state.sel}"] .st a`)?.click();
  else if (e.key === 'd') { const r = boardRows[state.sel]; if (r) toggleDone(r.item); }
});

// ---------------- refresh ----------------
// Scans run on the schedule in collect.yml (minutes 7 and 37 of every hour, UTC).
function nextScanIn(now) {
  const d = new Date(now);
  const m = d.getUTCMinutes();
  const next = m < 7 ? 7 : m < 37 ? 37 : 67;
  return next - m;
}
// On <owner>.github.io/<repo>/ the owner can start a scan from the Actions tab.
const site = (() => {
  const m = /^([\w-]+)\.github\.io$/i.exec(location.hostname);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return m && repo ? { owner: m[1].toLowerCase(), repo } : null;
})();
function paintScanLink() {
  const a = $('#scan');
  if (site && state.user === site.owner) {
    a.href = `https://github.com/${site.owner}/${site.repo}/actions/workflows/collect.yml`;
    a.hidden = false;
  } else a.hidden = true;
}
$('#refresh').onclick = async () => {
  const b = $('#refresh');
  b.disabled = true; b.textContent = '↻ Refreshing…';
  await load(false);
  b.textContent = '✓ Up to date';
  setTimeout(() => { b.textContent = '↻ Refresh'; b.disabled = false; }, 1500);
};

// ---------------- load ----------------
// The scan can be up to 30 minutes old (longer if CI stalls). Ask GitHub which items closed or merged
// since then and hide them. One unauthenticated call; if it fails, the page simply shows the scan.
async function dropClosedSinceScan(repo) {
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return 0;
  try {
    const since = new Date(Date.parse(data.generatedAt) - 10 * 60000).toISOString();
    const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=closed&since=${since}&per_page=100`, { headers: { accept: 'application/vnd.github+json' } });
    if (!res.ok) return 0;
    const closed = new Set((await res.json()).map((i) => i.number));
    const before = data.items.length;
    data.items = data.items.filter((i) => !closed.has(i.n));
    return before - data.items.length;
  } catch { return 0; }
}
async function load(first) {
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    const repo = data.repo.split(' ')[0];
    for (const i of data.items) i.url ||= `https://github.com/${repo}/${i.t === 'pr' ? 'pull' : 'issues'}/${i.n}`;
    const hidden = await dropClosedSinceScan(repo);
    $('#repo').textContent = data.repo;
    const age = (Date.now() - Date.parse(data.generatedAt)) / 60000;
    $('#fresh').textContent = `${data.items.length} open · scanned ${humanAge(data.generatedAt, Date.now())} ago · next in ${nextScanIn(Date.now())}m${hidden ? ` · ${hidden} closed since, hidden` : ''}`;
    paintScanLink();
    $('#fresh').classList.toggle('stale', age > 180);
    if (first) { if (state.user) readVisit(); paintMe(); }
    render();
  } catch (err) {
    $('#fresh').textContent = `could not load data (${err.message})`;
    $('#fresh').classList.add('stale');
  }
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
load(true);
setInterval(() => load(false), 5 * 60 * 1000);
</script>
